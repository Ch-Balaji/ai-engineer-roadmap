<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1320" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#9CA3AF">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#34D399">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#F97316">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1320" fill="#111827" rx="12"/>

  <!-- Title -->
  <text x="400" y="48" text-anchor="middle" font-size="24" font-weight="bold" fill="#F9FAFB">Full Job Search Agent Pipeline</text>
  <text x="400" y="74" text-anchor="middle" font-size="13" fill="#9CA3AF">From job discovery to mock interview - 5 agents, end to end</text>

  <!-- USER INPUT -->
  <rect x="180" y="96" width="440" height="52" rx="8" fill="#059669" stroke="#10B981" stroke-width="1.5"/>
  <text x="400" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">YOUR PROFILE (resume + preferences)</text>

  <line x1="400" y1="148" x2="400" y2="174" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agent A -->
  <rect x="100" y="176" width="600" height="96" rx="8" fill="url(#boxGrad)" stroke="#3B82F6" stroke-width="2"/>
  <text x="400" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#60A5FA">Agent A: JOB SCOUT</text>
  <text x="400" y="232" text-anchor="middle" font-size="12" fill="#D1D5DB">Searches LinkedIn, Indeed, company career pages</text>
  <text x="400" y="254" text-anchor="middle" font-size="12" fill="#34D399" font-weight="bold">Finds 50 jobs matching your profile</text>

  <!-- Output badge A -->
  <rect x="620" y="188" width="68" height="24" rx="12" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1"/>
  <text x="654" y="204" text-anchor="middle" font-size="10" fill="#93C5FD">50 jobs</text>

  <line x1="400" y1="272" x2="400" y2="298" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agent B -->
  <rect x="100" y="300" width="600" height="96" rx="8" fill="url(#boxGrad)" stroke="#3B82F6" stroke-width="2"/>
  <text x="400" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#60A5FA">Agent B: JOB FILTER</text>
  <text x="400" y="356" text-anchor="middle" font-size="12" fill="#D1D5DB">Reads all 50 JDs</text>
  <text x="400" y="378" text-anchor="middle" font-size="12" fill="#34D399" font-weight="bold">Filters to top 10 by match score + salary + location</text>

  <rect x="620" y="312" width="68" height="24" rx="12" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1"/>
  <text x="654" y="328" text-anchor="middle" font-size="10" fill="#93C5FD">top 10</text>

  <line x1="400" y1="396" x2="400" y2="422" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agent C - parallel -->
  <rect x="80" y="424" width="640" height="148" rx="8" fill="url(#boxGrad)" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="400" y="454" text-anchor="middle" font-size="15" font-weight="bold" fill="#FBBF24">Agent C: APPLICATION FACTORY</text>
  <rect x="310" y="462" width="180" height="22" rx="11" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
  <text x="400" y="477" text-anchor="middle" font-size="11" font-weight="bold" fill="#FDE68A">RUNS 10x IN PARALLEL</text>

  <!-- Mini pipeline inside C -->
  <rect x="120" y="498" width="130" height="36" rx="6" fill="#374151" stroke="#6B7280" stroke-width="1"/>
  <text x="185" y="520" text-anchor="middle" font-size="10" fill="#E5E7EB">Tailor resume</text>

  <text x="262" y="520" text-anchor="middle" font-size="14" fill="#6B7280">-&gt;</text>

  <rect x="278" y="498" width="130" height="36" rx="6" fill="#374151" stroke="#6B7280" stroke-width="1"/>
  <text x="343" y="520" text-anchor="middle" font-size="10" fill="#E5E7EB">Cover letter</text>

  <text x="420" y="520" text-anchor="middle" font-size="14" fill="#6B7280">-&gt;</text>

  <rect x="436" y="498" width="100" height="36" rx="6" fill="#374151" stroke="#F59E0B" stroke-width="1"/>
  <text x="486" y="520" text-anchor="middle" font-size="10" fill="#FDE68A">Critic</text>

  <text x="548" y="520" text-anchor="middle" font-size="14" fill="#6B7280">-&gt;</text>

  <rect x="564" y="498" width="80" height="36" rx="6" fill="#374151" stroke="#F97316" stroke-width="1"/>
  <text x="604" y="520" text-anchor="middle" font-size="10" fill="#FDBA74">Revise</text>

  <text x="400" y="558" text-anchor="middle" font-size="11" fill="#9CA3AF" font-style="italic">One tailored application package per job</text>

  <!-- Parallel lines visual -->
  <line x1="160" y1="570" x2="640" y2="570" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="120" y="574" font-size="9" fill="#F59E0B">x10</text>
  <text x="660" y="574" font-size="9" fill="#F59E0B">x10</text>

  <line x1="400" y1="572" x2="400" y2="598" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agent D -->
  <rect x="100" y="600" width="600" height="96" rx="8" fill="url(#boxGrad)" stroke="#8B5CF6" stroke-width="2"/>
  <text x="400" y="630" text-anchor="middle" font-size="15" font-weight="bold" fill="#A78BFA">Agent D: SUBMISSION AGENT</text>
  <text x="400" y="656" text-anchor="middle" font-size="12" fill="#D1D5DB">Fills out application forms</text>
  <text x="400" y="678" text-anchor="middle" font-size="12" fill="#D1D5DB">Uploads documents  |  Tracks status</text>

  <line x1="400" y1="696" x2="400" y2="722" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agent E -->
  <rect x="100" y="724" width="600" height="112" rx="8" fill="url(#boxGrad)" stroke="#EC4899" stroke-width="2"/>
  <text x="400" y="754" text-anchor="middle" font-size="15" font-weight="bold" fill="#F472B6">Agent E: INTERVIEW COACH</text>
  <text x="400" y="780" text-anchor="middle" font-size="12" fill="#D1D5DB">For each company: researches the company, preps specific questions</text>
  <text x="400" y="802" text-anchor="middle" font-size="12" fill="#34D399" font-weight="bold">Runs a mock interview with you</text>
  <text x="400" y="824" text-anchor="middle" font-size="11" fill="#9CA3AF" font-style="italic">Per-company prep when you get a callback</text>

  <line x1="400" y1="836" x2="400" y2="862" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- FINAL OUTPUT -->
  <rect x="180" y="864" width="440" height="52" rx="8" fill="#7C3AED" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="400" y="896" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">READY TO INTERVIEW</text>

  <!-- Summary panel -->
  <rect x="60" y="940" width="680" height="340" rx="10" fill="#1F2937" stroke="#374151" stroke-width="1.5"/>
  <text x="400" y="972" text-anchor="middle" font-size="14" font-weight="bold" fill="#9CA3AF">Pipeline at a glance</text>
  <line x1="80" y1="986" x2="720" y2="986" stroke="#374151" stroke-width="1"/>

  <!-- Row 1 -->
  <circle cx="110" cy="1020" r="14" fill="#3B82F6"/>
  <text x="110" y="1025" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">A</text>
  <text x="140" y="1016" font-size="12" fill="#F9FAFB" font-weight="bold">Scout</text>
  <text x="140" y="1034" font-size="11" fill="#9CA3AF">50 jobs found</text>

  <circle cx="310" cy="1020" r="14" fill="#3B82F6"/>
  <text x="310" y="1025" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">B</text>
  <text x="340" y="1016" font-size="12" fill="#F9FAFB" font-weight="bold">Filter</text>
  <text x="340" y="1034" font-size="11" fill="#9CA3AF">Top 10 shortlisted</text>

  <circle cx="510" cy="1020" r="14" fill="#F59E0B"/>
  <text x="510" y="1025" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">C</text>
  <text x="540" y="1016" font-size="12" fill="#F9FAFB" font-weight="bold">Factory</text>
  <text x="540" y="1034" font-size="11" fill="#9CA3AF">10 apps in parallel</text>

  <!-- Row 2 -->
  <circle cx="210" cy="1090" r="14" fill="#8B5CF6"/>
  <text x="210" y="1095" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">D</text>
  <text x="240" y="1086" font-size="12" fill="#F9FAFB" font-weight="bold">Submit</text>
  <text x="240" y="1104" font-size="11" fill="#9CA3AF">Forms + tracking</text>

  <circle cx="510" cy="1090" r="14" fill="#EC4899"/>
  <text x="510" y="1095" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">E</text>
  <text x="540" y="1086" font-size="12" fill="#F9FAFB" font-weight="bold">Coach</text>
  <text x="540" y="1104" font-size="11" fill="#9CA3AF">Mock interviews</text>

  <!-- Funnel visual -->
  <text x="400" y="1158" text-anchor="middle" font-size="13" fill="#D1D5DB">50 jobs  -&gt;  10 targets  -&gt;  10 applications  -&gt;  submitted  -&gt;  interview-ready</text>

  <!-- Legend -->
  <rect x="120" y="1188" width="560" height="72" rx="8" fill="#111827" stroke="#4B5563" stroke-width="1"/>
  <rect x="140" y="1208" width="12" height="12" rx="2" fill="#3B82F6"/>
  <text x="160" y="1218" font-size="11" fill="#9CA3AF">Discovery + filtering</text>
  <rect x="300" y="1208" width="12" height="12" rx="2" fill="#F59E0B"/>
  <text x="320" y="1218" font-size="11" fill="#9CA3AF">Parallel application generation</text>
  <rect x="510" y="1208" width="12" height="12" rx="2" fill="#8B5CF6"/>
  <text x="530" y="1218" font-size="11" fill="#9CA3AF">Submission + coaching</text>
  <text x="400" y="1244" text-anchor="middle" font-size="11" fill="#6B7280" font-style="italic">Each agent owns one stage - you approve before submissions go out</text>

</svg>
