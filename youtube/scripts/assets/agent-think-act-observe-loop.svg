<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#C2562F">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
    <marker id="arrow-dark" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#1A1A1A">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#0F4C4A">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#6E665C">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#F5EFE6" rx="16"/>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" font-size="28" font-weight="bold" fill="#1A1A1A">AI AGENT: Think - Act - Observe Loop</text>
  <text x="600" y="78" text-anchor="middle" font-size="15" fill="#6E665C">Ravi's job application: one instruction, full workflow</text>

  <!-- ============================================ -->
  <!-- CENTRAL BRAIN CIRCLE -->
  <!-- ============================================ -->
  <circle cx="600" cy="310" r="72" fill="#0F4C4A" stroke="#1A1A1A" stroke-width="2"/>
  <text x="600" y="303" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">LLM</text>
  <text x="600" y="325" text-anchor="middle" font-size="13" fill="#b8d8d6">(the brain)</text>

  <!-- ============================================ -->
  <!-- THREE CONNECTED BOXES: Tools / Memory / Loop -->
  <!-- ============================================ -->

  <!-- TOOLS box - left -->
  <rect x="310" y="265" width="140" height="55" rx="10" fill="#FFFFFF" stroke="#C2562F" stroke-width="2"/>
  <text x="380" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#C2562F">TOOLS</text>
  <text x="380" y="308" text-anchor="middle" font-size="11" fill="#6E665C">APIs, files, search</text>
  <line x1="450" y1="292" x2="528" y2="305" stroke="#C2562F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- MEMORY box - right -->
  <rect x="750" y="265" width="140" height="55" rx="10" fill="#FFFFFF" stroke="#0F4C4A" stroke-width="2"/>
  <text x="820" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F4C4A">MEMORY</text>
  <text x="820" y="308" text-anchor="middle" font-size="11" fill="#6E665C">Context across steps</text>
  <line x1="672" y1="305" x2="750" y2="292" stroke="#0F4C4A" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- ORCHESTRATION LOOP box - top -->
  <rect x="510" y="175" width="180" height="45" rx="10" fill="#C2562F" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="600" y="203" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">ORCHESTRATION LOOP</text>
  <line x1="600" y1="220" x2="600" y2="238" stroke="#C2562F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============================================ -->
  <!-- THE LOOP: THINK - ACT - OBSERVE              -->
  <!-- Three large circles in a triangle             -->
  <!-- ============================================ -->

  <!-- THINK circle - left -->
  <circle cx="370" cy="560" r="62" fill="#0F4C4A" stroke="#1A1A1A" stroke-width="2"/>
  <text x="370" y="555" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">THINK</text>
  <text x="370" y="578" text-anchor="middle" font-size="12" fill="#b8d8d6">Plan next step</text>

  <!-- ACT circle - right -->
  <circle cx="830" cy="560" r="62" fill="#C2562F" stroke="#1A1A1A" stroke-width="2"/>
  <text x="830" y="555" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">ACT</text>
  <text x="830" y="578" text-anchor="middle" font-size="12" fill="#f5d5c8">Call a tool</text>

  <!-- OBSERVE circle - bottom center -->
  <circle cx="600" cy="730" r="62" fill="#D6A04A" stroke="#1A1A1A" stroke-width="2"/>
  <text x="600" y="725" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">OBSERVE</text>
  <text x="600" y="748" text-anchor="middle" font-size="12" fill="#fff8e8">Read the result</text>

  <!-- Arrow: THINK to ACT -->
  <line x1="432" y1="545" x2="768" y2="545" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <text x="600" y="533" text-anchor="middle" font-size="12" fill="#6E665C" font-style="italic">"Analyze the JD" -- calls analyze_jd()</text>

  <!-- Arrow: ACT to OBSERVE -->
  <line x1="795" y1="615" x2="648" y2="700" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <text x="752" y="665" text-anchor="middle" font-size="12" fill="#6E665C" font-style="italic">"Got: RAG, LLM, vector DB"</text>

  <!-- Arrow: OBSERVE to THINK (the loop-back) -->
  <line x1="552" y1="700" x2="405" y2="615" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <text x="448" y="665" text-anchor="middle" font-size="12" fill="#6E665C" font-style="italic">"Score 52% -- rewrite"</text>

  <!-- Dashed line from brain to THINK (starting the loop) -->
  <path d="M 560 375 Q 430 445 385 498" stroke="#6E665C" stroke-width="1.5" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow-gray)"/>
  <text x="455" y="438" text-anchor="middle" font-size="11" fill="#6E665C" font-style="italic">starts here</text>

  <!-- ============================================ -->
  <!-- RAVI'S JOURNEY - step-by-step panel on right  -->
  <!-- ============================================ -->
  <rect x="920" y="400" width="260" height="390" rx="12" fill="#FFFFFF" stroke="#0F4C4A" stroke-width="1.5"/>
  <text x="1050" y="428" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F4C4A">Ravi's Journey</text>
  <line x1="940" y1="440" x2="1160" y2="440" stroke="#e0d8cc" stroke-width="1"/>

  <!-- Step 1 -->
  <circle cx="950" cy="468" r="11" fill="#0F4C4A"/>
  <text x="950" y="472" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="970" y="472" font-size="13" fill="#1A1A1A" font-weight="bold">THINK</text>
  <text x="970" y="489" font-size="11" fill="#6E665C">"Analyze JD first"</text>

  <!-- Step 2 -->
  <circle cx="950" cy="520" r="11" fill="#C2562F"/>
  <text x="950" y="524" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="970" y="524" font-size="13" fill="#1A1A1A" font-weight="bold">ACT</text>
  <text x="1010" y="524" font-size="12" fill="#C2562F">analyze_jd()</text>
  <text x="970" y="541" font-size="11" fill="#6E665C">Keywords: RAG, LLM, vector DB</text>

  <!-- Step 3 -->
  <circle cx="950" cy="572" r="11" fill="#D6A04A"/>
  <text x="950" y="576" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="970" y="576" font-size="13" fill="#1A1A1A" font-weight="bold">OBSERVE</text>
  <text x="970" y="593" font-size="11" fill="#6E665C">Score: 52%. Gaps: RAG, embeddings</text>

  <!-- Step 4 -->
  <circle cx="950" cy="624" r="11" fill="#C2562F"/>
  <text x="950" y="628" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="970" y="628" font-size="13" fill="#1A1A1A" font-weight="bold">ACT</text>
  <text x="1010" y="628" font-size="12" fill="#C2562F">rewrite_bullets()</text>
  <text x="970" y="645" font-size="11" fill="#6E665C">Aligned to JD language</text>

  <!-- Step 5 -->
  <circle cx="950" cy="676" r="11" fill="#C2562F"/>
  <text x="950" y="680" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">5</text>
  <text x="970" y="680" font-size="13" fill="#1A1A1A" font-weight="bold">ACT</text>
  <text x="1010" y="680" font-size="12" fill="#C2562F">write_cover_letter()</text>

  <!-- Step 6 -->
  <circle cx="950" cy="728" r="11" fill="#D6A04A"/>
  <text x="950" y="732" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">6</text>
  <text x="970" y="732" font-size="13" fill="#1A1A1A" font-weight="bold">OBSERVE</text>
  <text x="970" y="749" font-size="11" fill="#6E665C">Critic: 6/10 -- revise -- 8/10</text>

  <!-- Checkmark for pass -->
  <circle cx="1140" cy="740" r="14" fill="#0F4C4A"/>
  <text x="1140" y="746" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">OK</text>

  <!-- Revision loop arrow on right side of panel -->
  <path d="M 1160 749 Q 1185 688 1160 645" stroke="#C2562F" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="1192" y="700" font-size="10" fill="#C2562F" font-weight="bold">REVISE</text>

  <!-- ============================================ -->
  <!-- BOTTOM KEY INSIGHT BAR                        -->
  <!-- ============================================ -->
  <rect x="80" y="840" width="520" height="42" rx="8" fill="#0F4C4A"/>
  <text x="340" y="867" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">One instruction -- full workflow. The loop decides the plan.</text>

</svg>